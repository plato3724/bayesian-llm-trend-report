name: ingest-article

# When a new article issue is opened or labeled, pull it into the
# knowledge_state queue, fetch the canonical text, classify/extract it,
# then refresh the knowledge page. The workflow comments early so the
# issue does not look idle, confirms article-library ingestion before
# the slow synthesis pass, then posts a final completion update.
#
# Triggers:
#   - issue lifecycle events for issues carrying the `article` label
#     (`opened`, `edited`, `reopened`, `labeled`)
#   - manual workflow_dispatch for recovery / re-runs
#
# Output:
#   - an acknowledgement comment is posted immediately
#   - sync-issues imports the URL into knowledge_state/articles/<id>/record.json
#   - fetch-pending attempts HTTP fetch and writes canonical_text.txt
#   - article-library changes are committed before deep synthesis refresh
#   - final synthesis changes are committed with a bot signature
#
# Safety:
#   - uses the built-in GITHUB_TOKEN and optional OpenRouter secret
#   - if nothing actually changed, skips the commit
#   - fetch failures are non-fatal: the record is persisted with
#     content_state.full_text_status=fetch_failed/blocked and you can
#     fall back to manual paste via attach-manual

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "How many pending articles to fetch in this run"
        required: false
        default: "20"

# Only run the ingest job when the issue currently carries the `article`
# label (or the label event itself was `article`), or when the workflow
# was dispatched manually.
jobs:
  acknowledge:
    if: ${{ github.event_name == 'issues' && (github.event.label.name == 'article' || contains(github.event.issue.labels.*.name, 'article')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      # The same issue can emit `opened` and `labeled` events close together.
      # Serialize only the acknowledgement for that issue so we update one
      # comment instead of creating duplicates.
      group: ingest-ack-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Acknowledge article issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/knowledge.html
        run: |
          python scripts/knowledge_issue_comment.py ack --issue-number "$ISSUE_NUMBER" \
            || echo "Acknowledgement comment failed (not fatal)."

  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'article' || contains(github.event.issue.labels.*.name, 'article') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      # Serialize ingest runs so two simultaneous issue labels don't race
      # on the same knowledge_state/*.json files.
      group: ingest-knowledge-state
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # We need a real ref we can push back to.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Decide whether this issue event needs ingest
        id: preflight
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          python scripts/knowledge_issue_comment.py should-ingest \
            --issue-number "$ISSUE_NUMBER" \
            --action "$ISSUE_ACTION" >> "$GITHUB_OUTPUT"

      - name: Skip duplicate issue event
        if: ${{ github.event_name == 'issues' && steps.preflight.outputs.should_ingest == 'false' }}
        run: |
          echo "This labeled event was already completed by an earlier issue event."

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync triggering issue into knowledge_state
        if: ${{ github.event_name == 'issues' && steps.preflight.outputs.should_ingest != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/bayesian_reader.py sync-issue --issue-number "${{ github.event.issue.number }}"

      - name: Sync GitHub issues into knowledge_state
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        env:
          # `gh` CLI on ubuntu-latest is already installed; it just needs a token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/bayesian_reader.py sync-issues

      - name: Fetch pending articles
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        run: |
          LIMIT="${{ github.event.inputs.fetch_limit || '20' }}"
          python scripts/bayesian_reader.py fetch-pending --limit "$LIMIT"

      - name: Show acquisition status
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        run: python scripts/bayesian_reader.py status

      - name: Update article library
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
          OPENROUTER_REFERER: https://github.com/${{ github.repository }}
          OPENROUTER_TITLE: "tec_trade knowledge system"
        run: |
          python scripts/knowledge_pipeline.py run-mvp --skip-frameworks
          python scripts/knowledge_pipeline.py build-report

      - name: Commit and push article ingest changes
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            knowledge_state/articles/ \
            knowledge_state/taxonomy/ \
            knowledge_state/concepts/ \
            knowledge_state/reviews/ \
            knowledge_state/frameworks/ \
            knowledge_state/judgments/ \
            knowledge_state/theories/ \
            knowledge_state/change_log.jsonl \
            docs/knowledge.html || true

          if git diff --staged --quiet; then
            echo "No article ingest changes to commit."
            exit 0
          fi

          if [ -n "${{ github.event.issue.number }}" ]; then
            SUBJECT="chore(ingest): sync issue #${{ github.event.issue.number }}"
          else
            SUBJECT="chore(ingest): manual fetch-pending run"
          fi

          git commit -m "$SUBJECT" -m "Automated knowledge workflow: sync/fetch article, classify, update the article library, and rebuild docs/knowledge.html. Deep synthesis refresh runs in a later step. Legacy Bayesian report is not updated." -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Comment article ingest result
        if: ${{ github.event_name == 'issues' && steps.preflight.outputs.should_ingest != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/knowledge.html
        run: |
          python scripts/knowledge_issue_comment.py result \
            --issue-number "$ISSUE_NUMBER" \
            --phase quick \
            || echo "Article ingest comment failed (not fatal)."

      - name: Refresh deep synthesis
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_DEFAULT_MODEL: ${{ vars.OPENROUTER_DEFAULT_MODEL }}
          OPENROUTER_REFERER: https://github.com/${{ github.repository }}
          OPENROUTER_TITLE: "tec_trade knowledge system"
        run: |
          python scripts/knowledge_pipeline.py refresh-llm-reviews
          python scripts/knowledge_pipeline.py build-frameworks
          python scripts/knowledge_pipeline.py build-report

      - name: Commit and push synthesis changes
        if: ${{ github.event_name == 'workflow_dispatch' || steps.preflight.outputs.should_ingest != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage the paths this workflow is allowed to modify.
          # This keeps drift in unrelated files from leaking into an
          # "ingest" commit, and makes the diff auditable.
          git add \
            knowledge_state/articles/ \
            knowledge_state/taxonomy/ \
            knowledge_state/concepts/ \
            knowledge_state/reviews/ \
            knowledge_state/frameworks/ \
            knowledge_state/judgments/ \
            knowledge_state/theories/ \
            knowledge_state/change_log.jsonl \
            docs/knowledge.html || true

          if git diff --staged --quiet; then
            echo "No synthesis changes to commit."
            exit 0
          fi

          if [ -n "${{ github.event.issue.number }}" ]; then
            SUBJECT="chore(knowledge): refresh synthesis for issue #${{ github.event.issue.number }}"
          else
            SUBJECT="chore(knowledge): refresh synthesis from manual ingest"
          fi

          git commit -m "$SUBJECT" -m "Automated knowledge workflow: refresh LLM reviews, rebuild frameworks, and rebuild docs/knowledge.html. Legacy Bayesian report is not updated." -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Comment on the triggering issue
        if: ${{ github.event_name == 'issues' && steps.preflight.outputs.should_ingest != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/knowledge.html
        run: |
          python scripts/knowledge_issue_comment.py result \
            --issue-number "$ISSUE_NUMBER" \
            --phase final \
            || echo "Final knowledge comment failed (not fatal)."
